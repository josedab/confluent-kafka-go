name: Code Coverage

on:
  pull_request:
  push:
    branches:
      - master
      - v[0-9]+.[0-9]+.x

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout confluent-kafka-go
        uses: actions/checkout@v3

      - name: Checkout librdkafka
        uses: actions/checkout@v3
        with:
          repository: confluentinc/librdkafka
          path: './librdkafka'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'  # Minimum version for modern coverage support

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libcurl4-openssl-dev libssl-dev libsasl2-dev libzstd-dev

      - name: Build and install librdkafka
        run: |
          cd librdkafka
          ./configure --install-deps --enable-devel --disable-lz4-ext --prefix=/usr
          make
          sudo make install

      - name: Run tests with coverage
        run: |
          cd kafka
          go test -v -timeout 5m -coverprofile=coverage.out -covermode=atomic -tags dynamic ./...

      - name: Display coverage summary
        run: |
          cd kafka
          go tool cover -func=coverage.out | tail -20

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: ./kafka/coverage.out
          flags: unittests
          name: codecov-confluent-kafka-go
          fail_ci_if_error: false  # Don't fail on upload errors initially
          verbose: true

      - name: Generate coverage HTML report
        run: |
          cd kafka
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage HTML as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: kafka/coverage.html
          retention-days: 30
